      .button {
        background-color: rgb(230, 230, 230);
        color: black;
        border: none;
        border-radius: 5px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .button-on {

<body>
  <button class="js-button-1 button" onclick="toggleButton('.js-button-1')">Gaming</button>
  <button class="js-button-2 button" onclick="toggleButton('.js-button-2')">Music</button>
  <button class="js-button-3 button" onclick="toggleButton('.js-button-3')">Tech</button>

    
  <script>

    function toggleButton(selector) {
      let currentBtn = document.querySelector(selector);

      if (!currentBtn.classList.contains('button-on')) {
        turnOffPreviousBtn();
        currentBtn.classList.add('button-on')
      } else {
        currentBtn.classList.remove('button-on')
      }
    }

    function turnOffPreviousBtn() {
      let butn = document.querySelector('.button-on');

      if (butn) {
        butn.classList.remove('button-on');
      }

    }
