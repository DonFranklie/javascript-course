<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise (9)</title>
</head>
<body>
  <input type="text" class="js-input" onkeyup="handleKeyup(event)">
  <p class="js-display"></p>

  <script> 

    function handleKeyup(event) {
      let inputElement = document.querySelector('.js-input');

       document.querySelector('.js-display').innerHTML = inputElement.value;
    }
    
       
    </script>

</body>
</html>
