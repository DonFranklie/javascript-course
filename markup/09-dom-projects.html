<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
</head>
<body>
  <p>YouTube Subscribe Button</p>
  <button class="js-subscribe-button" onclick="subscribe()">Subscribe</button>


  <p>Rock Paper Scissors</p>
  <a href="/markup/09-rock-paper-scissors.html">Click here</a>


  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 =  FREE shipping.</p>

  <input type="text" name="" id="" autocomplete="off" onkeydown="handleCostKeydown(event)" placeholder="Cost of Order"> <button class="calculate-btn" onclick="calculateTotal()">Calculate</button>
  <p class="total-amount"></p>

  <script> 

    function handleCostKeydown(event) {
        if (event.key === 'Enter') {
            calculateTotal();
        }
    }

    function calculateTotal() {
    const amountInput = document.querySelector('input');
    const totalAmount = document.querySelector('.total-amount');
    let cost = +amountInput.value;

      if (cost < 40 && cost > 0 ) {
        cost *= 100;
        cost += 1000;
        cost /= 100;
        totalAmount.innerHTML = `$${cost}`;
      
      } else if (cost >= 40) {
        totalAmount.innerHTML = `$${cost}`;
       
      } else {
        totalAmount.innerHTML = 'Enter the correct amount';
       
      }
    }
    

    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');
        if (buttonElement.innerText === 'Subscribe') {
          buttonElement.innerText = 'Subscribed'
        } else {
          buttonElement.innerText = 'Subscribe'
        }
    }

  </script>
</body>
</html>
